<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Account &amp; Orders — NEST &amp; NOVA</title>
  <meta name="description" content="Manage your client profile, view past orders, and track shipments.">

  <!-- Google Fonts & Font Awesome 6 Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
</head>

<body style="background-color: #F8FAF6;">

  <!-- Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        <span class="logo-title">NEST &amp; NOVA</span>
        <span class="logo-subtitle">Smart Technology. Timeless Living.</span>
      </a>

      <!-- Prominent Department Switcher -->
      <div class="dept-switcher-bar">
        <a href="electronics.html" class="dept-pill-btn" title="Electronics Department">
          <i class="fa-solid fa-microchip"></i> Electronics
        </a>
        <a href="furniture.html" class="dept-pill-btn" title="Furniture Department">
          <i class="fa-solid fa-couch"></i> Furniture
        </a>
      </div>

      <nav class="main-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="electronics.html" class="nav-link">Electronics</a>
        <a href="furniture.html" class="nav-link">Furniture</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="header-actions">
        <a href="search.html" class="action-btn" title="Search"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="wishlist.html" class="action-btn" title="Wishlist">
          <i class="fa-regular fa-heart"></i>
          <span class="badge-counter wishlist-counter" style="display: none;">0</span>
        </a>
        <a href="cart.html" class="action-btn" title="Cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="badge-counter cart-counter" style="display: none;">0</span>
        </a>
        <button class="action-btn" onclick="Auth.logout()" title="Sign Out">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <main style="padding: 40px 0 80px;">
    <div class="container">

      <div class="account-layout-grid" style="display: grid; grid-template-columns: 280px 1fr; gap: 40px;">

        <!-- Account Sidebar -->
        <aside>
          <div
            style="background-color: var(--pure-white); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 28px; box-shadow: var(--shadow-subtle); text-align: center; margin-bottom: 24px;">
            <div
              style="width: 64px; height: 64px; border-radius: var(--radius-full); background: var(--light-sage); color: var(--dark-sage); font-size: 1.6rem; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;">
              <i class="fa-regular fa-user"></i>
            </div>
            <h2 id="account-full-name" style="font-size: 1.25rem; color: var(--walnut-brown); margin-bottom: 4px;">
              Loading...</h2>
            <div id="account-email" style="font-size: 0.85rem; color: var(--muted-text); margin-bottom: 12px;">...</div>
            <div id="account-phone" style="font-size: 0.82rem; color: var(--dark-sage); font-weight: 500;">...</div>
          </div>

          <div
            style="background-color: var(--pure-white); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-subtle);">
            <ul style="display: flex; flex-direction: column; gap: 6px;">
              <li>
                <button class="btn btn-outline-sage btn-block" style="justify-content: flex-start;"
                  onclick="showAccountTab('orders')">
                  <i class="fa-solid fa-box"></i> Order History
                </button>
              </li>
              <li>
                <button class="btn btn-outline btn-block" style="justify-content: flex-start;"
                  onclick="showAccountTab('profile')">
                  <i class="fa-solid fa-user-pen"></i> Personal Details
                </button>
              </li>
              <li>
                <button class="btn btn-outline btn-block"
                  style="justify-content: flex-start; color: var(--error-color); border-color: #E2B2AC;"
                  onclick="Auth.logout()">
                  <i class="fa-solid fa-power-off"></i> Sign Out
                </button>
              </li>
            </ul>
          </div>
        </aside>

        <!-- Main Account Content Area -->
        <div>

          <!-- Tab 1: Orders -->
          <div id="tab-orders">
            <h2 style="font-size: 1.8rem; color: var(--walnut-brown); margin-bottom: 20px;">Order History &amp; Tracking
            </h2>
            <div id="user-orders-list">
              <div style="text-align: center; padding: 50px 0;">
                <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--primary-sage);"></i>
                <p style="margin-top: 10px; color: var(--muted-text);">Loading your orders...</p>
              </div>
            </div>
          </div>

          <!-- Tab 2: Profile Settings -->
          <div id="tab-profile"
            style="display: none; background: var(--pure-white); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 32px; box-shadow: var(--shadow-subtle);">
            <h2 style="font-size: 1.6rem; color: var(--walnut-brown); margin-bottom: 20px;">Update Personal Information
            </h2>

            <form onsubmit="handleProfileUpdate(event)">
              <div class="form-group">
                <label class="form-label" for="edit-name">Full Name</label>
                <input type="text" id="edit-name" class="form-control" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="edit-phone">Phone Number</label>
                <input type="tel" id="edit-phone" class="form-control">
              </div>

              <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>

            <hr style="margin: 32px 0; border: none; border-top: 1px solid var(--border-color);">

            <h3 style="font-size: 1.3rem; color: var(--walnut-brown); margin-bottom: 16px;">Change Password</h3>
            <form onsubmit="handlePasswordChange(event)">
              <div class="form-group">
                <label class="form-label" for="curr-pass">Current Password</label>
                <input type="password" id="curr-pass" class="form-control" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="new-pass">New Password</label>
                <input type="password" id="new-pass" class="form-control" minlength="6" required>
              </div>

              <button type="submit" class="btn btn-secondary">Update Password</button>
            </form>
          </div>

        </div>

      </div>
    </div>
  </main>

  <!-- Core Scripts -->
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>

  <script>
    function showAccountTab(tab) {
      document.getElementById('tab-orders').style.display = tab === 'orders' ? 'block' : 'none';
      document.getElementById('tab-profile').style.display = tab === 'profile' ? 'block' : 'none';
    }

    async function handleProfileUpdate(e) {
      e.preventDefault();
      try {
        const full_name = document.getElementById('edit-name').value;
        const phone = document.getElementById('edit-phone').value;
        const res = await api.put('/auth/profile', { full_name, phone });
        showToast(res.message || 'Profile updated!', 'success');
        setTimeout(() => window.location.reload(), 1000);
      } catch (err) {
        showToast(err.message || 'Update failed.', 'error');
      }
    }

    async function handlePasswordChange(e) {
      e.preventDefault();
      try {
        const current_password = document.getElementById('curr-pass').value;
        const new_password = document.getElementById('new-pass').value;
        const res = await api.put('/auth/change-password', { current_password, new_password });
        showToast(res.message || 'Password changed successfully!', 'success');
        document.getElementById('curr-pass').value = '';
        document.getElementById('new-pass').value = '';
      } catch (err) {
        showToast(err.message || 'Failed to update password.', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.loadAccountDashboard();
      if (currentUser) {
        const editName = document.getElementById('edit-name');
        const editPhone = document.getElementById('edit-phone');
        if (editName) editName.value = currentUser.full_name;
        if (editPhone && currentUser.phone) editPhone.value = currentUser.phone;
      }
    });
  </script>
</body>

</html>
